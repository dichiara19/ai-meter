name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# least privilege: building (also pull requests from forks) only reads; publishing a release is a separate job
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Build (C# compiler of .NET Framework 4.8, included in Windows)
        shell: powershell
        run: ./build.ps1 -NoInstall

      - name: Upload unsigned build
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: AIMeter-unsigned
          path: |
            bin/AIMeter.exe
            bin/AIMeter.exe.config

      # Code signing via SignPath Foundation: active once the project is approved and
      # the repository variable SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN are set.
      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ai-meter
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Package
        shell: powershell
        run: |
          $exe = if (Test-Path signed\AIMeter.exe) { 'signed\AIMeter.exe' } else { 'bin\AIMeter.exe' }
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item $exe, bin\AIMeter.exe.config, LICENSE, NOTICE dist
          Compress-Archive dist\* AIMeter.zip
          # same app, started from source by PowerShell: for PCs with Smart App Control on
          New-Item -ItemType Directory script, script\src, script\assets, script\providers | Out-Null
          Copy-Item src\*.cs script\src
          Copy-Item assets\app.ico, assets\antigravity.png script\assets
          Copy-Item providers\*.json, providers\*.png script\providers
          Copy-Item AIMeter.ps1, 'Start AI Meter.cmd', LICENSE, NOTICE script
          Compress-Archive script\* AIMeter-script.zip

      # Microsoft Store package: the Store signs it (identity from Partner Center in the repository variables)
      - name: Build MSIX for the Microsoft Store
        shell: powershell
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_NAME: ${{ vars.STORE_PUBLISHER_NAME }}
        run: ./build.ps1 -NoInstall -Package

      - uses: actions/upload-artifact@v4
        with:
          name: AIMeter
          path: |
            AIMeter.zip
            AIMeter-script.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AIMeter-msix
          path: bin/AIMeter.msix

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: AIMeter

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AIMeter.zip
            AIMeter-script.zip
          body_path: RELEASE_NOTES.md
