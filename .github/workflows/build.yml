name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# least privilege: building (also pull requests from forks) only reads; publishing a release is a separate job
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      # Release tags: vX.Y.Z (stable), vX.Y.Z-beta.N or vX.Y.Z-rc.N (pre-releases). The numeric part must be the
      # assembly version and the whole tag the informational version, so a tag cannot ship a binary that reports
      # another version (the update check compares it).
      - name: Check the tag against the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)(-(beta|rc)\.[1-9]\d*)?$') {
              throw "Tag '$env:TAG' is not vX.Y.Z, vX.Y.Z-beta.N or vX.Y.Z-rc.N (see docs/RELEASING.md)."
          }
          $numeric = $Matches[1]
          $info = Get-Content src\AssemblyInfo.cs -Raw
          $assembly = [regex]::Match($info, 'AssemblyVersion\("(\d+\.\d+\.\d+)\.0"\)').Groups[1].Value
          $file = [regex]::Match($info, 'AssemblyFileVersion\("(\d+\.\d+\.\d+)\.0"\)').Groups[1].Value
          $informational = [regex]::Match($info, 'AssemblyInformationalVersion\("([^"]*)"\)').Groups[1].Value
          if ($assembly -ne $numeric -or $file -ne $numeric) {
              throw "Tag $env:TAG needs AssemblyVersion and AssemblyFileVersion $numeric.0 in src/AssemblyInfo.cs (found '$assembly.0' and '$file.0')."
          }
          if ($informational -ne $env:TAG.Substring(1)) {
              throw "Tag $env:TAG needs AssemblyInformationalVersion `"$($env:TAG.Substring(1))`" in src/AssemblyInfo.cs (found `"$informational`")."
          }
          Write-Host "Tag $env:TAG matches src/AssemblyInfo.cs."

      - name: Regression tests (isolated storage and loopback fixtures)
        shell: powershell
        run: ./tests/run.ps1

      - name: Coordinator plugin tests (fake AI Meter and fake agents)
        run: node --test plugins/ai-meter/tests/delegate.test.mjs

      - name: Build (C# compiler of .NET Framework 4.8, included in Windows)
        shell: powershell
        run: ./build.ps1 -NoInstall

      - name: Upload unsigned build
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: AIMeter-unsigned
          path: |
            bin/AIMeter.exe
            bin/AIMeter.exe.config

      # Code signing via SignPath Foundation: active once the project is approved and
      # the repository variable SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN are set.
      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ai-meter
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Package
        shell: powershell
        run: |
          $exe = if (Test-Path signed\AIMeter.exe) { 'signed\AIMeter.exe' } else { 'bin\AIMeter.exe' }
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item $exe, bin\AIMeter.exe.config, LICENSE, NOTICE dist
          Compress-Archive dist\* AIMeter.zip
          # same app, started from source by PowerShell: for PCs with Smart App Control on
          # The same copy as build.ps1's script install, plus the starter and the licence files.
          .\tools\copy-script-app.ps1 -Destination script
          Copy-Item 'Start AI Meter.cmd', LICENSE, NOTICE script
          Compress-Archive script\* AIMeter-script.zip
          # The script build embeds no resources, so it reads these folders: without agents, delegation finds no agents.
          Expand-Archive AIMeter-script.zip script-check
          foreach ($folder in 'src', 'providers', 'agents') {
            $missing = @(Get-ChildItem "$folder\*" -File -Include *.cs, *.json | Where-Object { -not (Test-Path "script-check\$folder\$($_.Name)") })
            if ($missing.Count) { throw "AIMeter-script.zip lacks $folder\$($missing[0].Name)." }
          }
          Remove-Item -Recurse script-check

      # Microsoft Store package: the Store signs it (identity from Partner Center in the repository variables)
      - name: Build MSIX for the Microsoft Store
        shell: powershell
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_NAME: ${{ vars.STORE_PUBLISHER_NAME }}
          STORE_DISPLAY_NAME: ${{ vars.STORE_DISPLAY_NAME }}
        run: |
          # Pull requests and branch builds use build.ps1's placeholder identity; a release package must carry the real one.
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
              $missing = @('STORE_IDENTITY_NAME', 'STORE_PUBLISHER', 'STORE_PUBLISHER_NAME', 'STORE_DISPLAY_NAME' | Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
              if ($missing) {
                  throw "Release $env:GITHUB_REF_NAME needs the Partner Center package identity: set the repository variables $($missing -join ', ') (Settings > Secrets and variables > Actions > Variables; see docs/STORE.md)."
              }
          }
          ./build.ps1 -NoInstall -Package

      - uses: actions/upload-artifact@v7
        with:
          name: AIMeter
          path: |
            AIMeter.zip
            AIMeter-script.zip

      - uses: actions/upload-artifact@v7
        with:
          name: AIMeter-msix
          path: bin/AIMeter.msix

  # The Windows App Certification Kit, the technical tests the Store runs during certification, on this build's MSIX.
  # The kit installs the package, so it is signed here with a throwaway certificate for its own publisher, trusted
  # only on the runner; the Store signs the real one. The report is uploaded as the AIMeter-wack artifact.
  certify:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: AIMeter-msix

      - name: Run the Windows App Certification Kit
        shell: powershell
        run: |
          $kit = 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\appcert.exe'
          if (-not (Test-Path $kit)) { throw "The Windows App Certification Kit is not installed on this runner ($kit)." }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          $msix = (Resolve-Path AIMeter.msix).Path

          # Sign with a certificate whose subject is the package's publisher, trusted only on this runner.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($msix)
          try { $manifest = [xml](New-Object IO.StreamReader(($zip.Entries | Where-Object FullName -eq 'AppxManifest.xml').Open())).ReadToEnd() }
          finally { $zip.Dispose() }
          $publisher = $manifest.Package.Identity.Publisher
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature -FriendlyName 'AI Meter WACK' `
              -CertStoreLocation Cert:\CurrentUser\My -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $cer = Join-Path $env:RUNNER_TEMP 'wack.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint $msix
          if ($LASTEXITCODE) { throw "signtool failed ($LASTEXITCODE)." }

          New-Item -ItemType Directory wack | Out-Null
          $report = Join-Path (Resolve-Path wack).Path 'report.xml'
          & $kit reset
          & $kit test -appxpackagepath $msix -reportoutputpath $report
          Write-Host "appcert exited with $LASTEXITCODE."
          if (-not (Test-Path $report)) { throw 'The kit wrote no report.' }

          # Summarise: the overall result, then every test that did not pass, with its messages.
          $xml = [xml](Get-Content $report -Raw)
          $overall = $xml.REPORT.OVERALL_RESULT
          Write-Host "Overall result: $overall"
          foreach ($test in $xml.SelectNodes('//TEST')) {
              $result = $test.RESULT.InnerText
              if ($result -and $result -ne 'PASS') {
                  Write-Host "::warning title=WACK $result::$($test.NAME)"
                  foreach ($message in $test.SelectNodes('.//MESSAGE')) { Write-Host "    $($message.InnerText.Trim())" }
              }
          }
          # The overall result counts only the required tests; optional ones, such as Blocked executables (AI Meter
          # starts cmd, PowerShell and WSL by design), are informational and do not affect Store onboarding.
          if ($overall -ne 'PASS') { throw "The Windows App Certification Kit result is $overall: see the AIMeter-wack artifact." }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: AIMeter-wack
          path: wack/

  # The plugin also runs inside WSL, where agents are stopped with SIGINT rather than taskkill.
  plugin-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Coordinator plugin tests (fake AI Meter and fake agents)
        run: node --test plugins/ai-meter/tests/delegate.test.mjs

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: AIMeter

      # vX.Y.Z is stable and becomes Latest, the release the apps' update check reads;
      # vX.Y.Z-beta.N and vX.Y.Z-rc.N are pre-releases and never become Latest.
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: |
            AIMeter.zip
            AIMeter-script.zip
            docs/media/history-dark.png
            docs/media/history-light.png
            docs/media/consumption-dark.png
            docs/media/consumption-light.png
          body_path: RELEASE_NOTES.md

  # Microsoft Store submission with Microsoft's Store Developer CLI (msstore), for stable tags only. It stays off
  # until the repository variable STORE_PRODUCT_ID and the four Partner Center API secrets are set (docs/STORE.md),
  # and it can only update an app whose first submission was made by hand in Partner Center.
  store:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && vars.STORE_PRODUCT_ID != '' && vars.STORE_IDENTITY_NAME != ''
    runs-on: windows-latest
    # Add required reviewers to this environment to approve each Store submission by hand.
    environment: microsoft-store
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: AIMeter-msix

      - name: Set up the Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1

      # Uploads the package to a new submission based on the last published one and commits it for certification.
      - name: Submit the package to Partner Center
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
        run: |
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msstore publish "$PWD/AIMeter.msix" -id $env:PRODUCT_ID
          exit $LASTEXITCODE
