# TEMPORARY: probes AppData write virtualisation for the MSIX without unvirtualizedResources. Remove before merging.
name: virtualisation-probe
on:
  push:
    branches: [store-without-unvirtualized-resources]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the package layout
        shell: powershell
        run: ./build.ps1 -NoInstall -Package
      - name: Register the layout and probe from inside the package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          reg add 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1 | Out-Null
          Add-AppxPackage -Register (Resolve-Path bin\msix\AppxManifest.xml)
          $pkg = Get-AppxPackage dichiara19.AIMeter
          $pfn = $pkg.PackageFamilyName
          Write-Host "Registered $pfn"
          $roam = [Environment]::GetFolderPath('ApplicationData')
          $private = Join-Path $env:LOCALAPPDATA "Packages\$pfn\LocalCache\Roaming"
          # Real files that exist before the packaged process runs, as a user's Claude Desktop config would.
          foreach ($d in 'ProbeCopy', 'ProbeReplace', 'ProbeWrite', 'ProbeTemp') { New-Item -ItemType Directory -Force (Join-Path $roam $d) | Out-Null }
          'old' | Set-Content (Join-Path $roam 'ProbeCopy\c.json')
          'old' | Set-Content (Join-Path $roam 'ProbeReplace\r.json')
          'old' | Set-Content (Join-Path $roam 'ProbeWrite\w.json')
          'old' | Set-Content (Join-Path $roam 'ProbeTemp\t.json')
          New-Item -ItemType Directory -Force C:\probe | Out-Null
          @'
          $ErrorActionPreference = 'Continue'
          $log = 'C:\probe\inside.txt'
          function Say($s) { Add-Content $log $s }
          $roam = [Environment]::GetFolderPath('ApplicationData')
          Say "inside: roaming=$roam"
          try { [IO.Directory]::CreateDirectory("$roam\ProbeNew") | Out-Null; [IO.File]::WriteAllText("$roam\ProbeNew\n.json", 'new'); Say 'new file: ok' } catch { Say "new file: $_" }
          try { [IO.File]::WriteAllText("$roam\ProbeCopy\c.json.tmp", 'copied'); [IO.File]::Copy("$roam\ProbeCopy\c.json.tmp", "$roam\ProbeCopy\c.json", $true); [IO.File]::Delete("$roam\ProbeCopy\c.json.tmp"); Say 'copy over existing: ok' } catch { Say "copy over existing: $_" }
          try { [IO.File]::WriteAllText("$roam\ProbeReplace\r.json.tmp", 'replaced'); [IO.File]::Replace("$roam\ProbeReplace\r.json.tmp", "$roam\ProbeReplace\r.json", $null); Say 'replace existing: ok' } catch { Say "replace existing: $_" }
          try { [IO.File]::WriteAllText("$roam\ProbeWrite\w.json", 'written'); Say 'write existing: ok' } catch { Say "write existing: $_" }
          try { Say ("read back copy=" + [IO.File]::ReadAllText("$roam\ProbeCopy\c.json") + " replace=" + [IO.File]::ReadAllText("$roam\ProbeReplace\r.json") + " write=" + [IO.File]::ReadAllText("$roam\ProbeWrite\w.json") + " new=" + [IO.File]::ReadAllText("$roam\ProbeNew\n.json")) } catch { Say "read back: $_" }
          Say ('exists new=' + [IO.File]::Exists("$roam\ProbeNew\n.json") + ' missing=' + [IO.File]::Exists("$roam\ProbeMissing\m.json"))
          Say 'done'
          '@ | Set-Content C:\probe\probe.ps1
          Invoke-CommandInDesktopPackage -PackageFamilyName $pfn -AppId App -Command 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe' -Args '-NoProfile -ExecutionPolicy Bypass -File C:\probe\probe.ps1'
          for ($i = 0; $i -lt 60 -and -not ((Test-Path C:\probe\inside.txt) -and (Select-String -Quiet done C:\probe\inside.txt)); $i++) { Start-Sleep 1 }
          Write-Host '--- inside the package'
          Get-Content C:\probe\inside.txt -ErrorAction SilentlyContinue
          Write-Host '--- outside, real AppData'
          foreach ($f in 'ProbeNew\n.json', 'ProbeCopy\c.json', 'ProbeReplace\r.json', 'ProbeWrite\w.json') {
              $p = Join-Path $roam $f
              Write-Host ("real {0}: {1}" -f $f, $(if (Test-Path $p) { (Get-Content $p -Raw).Trim() } else { '<missing>' }))
          }
          Write-Host '--- package private Roaming'
          if (Test-Path $private) { Get-ChildItem $private -Recurse -File | ForEach-Object { Write-Host ("private {0}: {1}" -f $_.FullName.Substring($private.Length), (Get-Content $_.FullName -Raw).Trim()) } } else { Write-Host "no $private" }
